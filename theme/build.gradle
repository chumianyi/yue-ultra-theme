plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.yue.ultra.theme'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    // Material3
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Compose Foundation
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.animation:animation-graphics'

    // Activity Compose
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // ViewPager2 for compatibility
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ConstraintLayout Compose
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.0.1'

    // Paging
    implementation 'androidx.paging:paging-compose:3.2.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// 构建完成后重命名AAR并生成JAR
afterEvaluate {
    assembleRelease.doLast {
        def aarDir = file("build/outputs/aar/")
        if (aarDir.exists()) {
            aarDir.listFiles().each { file ->
                if (file.name.endsWith('.aar') && !file.name.contains('Ultra')) {
                    def ultraName = file.name.replace('.aar', '-Ultra.aar')
                    copy {
                        from file
                        into aarDir
                        rename { ultraName }
                    }
                }
            }
        }

        def jarDir = file("build/outputs/jar/")
        jarDir.mkdirs()

        def classesJar = fileTree(dir: 'build/intermediates', include: '**/classes.jar').find()
        if (classesJar != null) {
            copy {
                from classesJar
                into jarDir
                rename { 'YueTheme.jar' }
            }
            copy {
                from classesJar
                into jarDir
                rename { 'YueThemeUltra.jar' }
            }
            println "JAR files generated at: ${jarDir.absolutePath}"
        } else {
            println "Warning: classes.jar not found"
        }
    }
}
