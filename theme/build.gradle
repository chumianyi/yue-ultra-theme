plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.yue.ultra.theme'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// 构建完成后重命名AAR并生成JAR
afterEvaluate {
    assembleRelease.doLast {
        def aarDir = file("build/outputs/aar/")
        if (aarDir.exists()) {
            aarDir.listFiles().each { file ->
                if (file.name.endsWith('.aar') && !file.name.contains('Ultra')) {
                    // 复制为Ultra版本
                    def ultraName = file.name.replace('.aar', '-Ultra.aar')
                    copy {
                        from file
                        into aarDir
                        rename { ultraName }
                    }
                }
            }
        }

        // 生成JAR文件
        def jarDir = file("build/outputs/jar/")
        jarDir.mkdirs()

        // 查找classes.jar
        def classesJar = fileTree(dir: 'build/intermediates', include: '**/classes.jar').find()
        if (classesJar != null) {
            copy {
                from classesJar
                into jarDir
                rename { 'YueTheme.jar' }
            }
            copy {
                from classesJar
                into jarDir
                rename { 'YueThemeUltra.jar' }
            }
            println "JAR files generated at: ${jarDir.absolutePath}"
        } else {
            println "Warning: classes.jar not found"
        }
    }
}
